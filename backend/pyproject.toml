[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-account-console-api"
version = "0.1.0"
description = "Internal Linux account management control plane"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14",
  "ansible-core>=2.18",
  "ansible-runner>=2.4",
  "bcrypt>=4.0",
  "cryptography>=43",
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

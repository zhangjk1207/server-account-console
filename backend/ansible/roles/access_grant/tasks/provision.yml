- name: Assert controlled grant paths
  ansible.builtin.assert:
    that:
      - access_grant.data_root is match('^/.+')
      - access_grant.data_directory == access_grant.data_root ~ '/' ~ access_grant.username
      - access_grant.username is match('^[a-z_][a-z0-9_-]{0,31}$')
    fail_msg: "授权路径或用户名不符合受控开通规则"

- name: Inspect existing logical home
  ansible.builtin.stat:
    path: "/home/{{ access_grant.username }}"
    follow: false
  register: access_grant_home

- name: Assert existing home is the controlled link
  ansible.builtin.assert:
    that:
      - not access_grant_home.stat.exists or (access_grant_home.stat.islnk | default(false) and access_grant_home.stat.lnk_source | default('') == access_grant.data_directory)
    fail_msg: "现有 /home 路径不是本系统创建的受控软链接，拒绝覆盖"

- name: Ensure primary group exists
  ansible.builtin.group:
    name: "{{ access_grant.username }}"
    state: present

- name: Ensure supplemental groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ access_grant.groups | default([]) }}"

- name: Ensure Linux account exists without a default home
  ansible.builtin.user:
    name: "{{ access_grant.username }}"
    group: "{{ access_grant.username }}"
    groups: "{{ access_grant.groups | default([]) | join(',') }}"
    append: true
    shell: "/bin/bash"
    home: "/home/{{ access_grant.username }}"
    create_home: false
    state: present

- name: Create user data directory
  ansible.builtin.file:
    path: "{{ access_grant.data_directory }}"
    state: directory
    owner: "{{ access_grant.username }}"
    group: "{{ access_grant.username }}"
    mode: "0750"

- name: Create controlled logical home link
  ansible.builtin.file:
    src: "{{ access_grant.data_directory }}"
    dest: "/home/{{ access_grant.username }}"
    state: link
    force: false

- name: Ensure SSH directory exists on data disk
  ansible.builtin.file:
    path: "{{ access_grant.data_directory }}/.ssh"
    state: directory
    owner: "{{ access_grant.username }}"
    group: "{{ access_grant.username }}"
    mode: "0700"

- name: Replace authorized keys with the enabled member key set
  ansible.builtin.copy:
    dest: "{{ access_grant.data_directory }}/.ssh/authorized_keys"
    content: "{{ access_grant_user.public_keys | join('\\n') }}\\n"
    owner: "{{ access_grant.username }}"
    group: "{{ access_grant.username }}"
    mode: "0600"

- name: Configure controlled sudo policy
  ansible.builtin.template:
    src: access-grant-sudoers.j2
    dest: "/etc/sudoers.d/server-account-{{ access_grant.username }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: access_grant.sudo_rule | default('', true) | length > 0

- name: Remove controlled sudo policy when no rule is declared
  ansible.builtin.file:
    path: "/etc/sudoers.d/server-account-{{ access_grant.username }}"
    state: absent
  when: access_grant.sudo_rule | default('', true) | length == 0

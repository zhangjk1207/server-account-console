- name: Collect local user facts
  ansible.builtin.getent:
    database: "{{ item }}"
  loop:
    - passwd
    - group
  when: host_operation.action | default('inspect') == 'inspect'

- name: Emit local user facts
  ansible.builtin.debug:
    msg:
      getent_passwd: "{{ getent_passwd }}"
      getent_group: "{{ getent_group }}"
  when: host_operation.action | default('inspect') == 'inspect'

- name: Load selected user passwd entry for key inspection
  ansible.builtin.getent:
    database: passwd
    key: "{{ host_operation.username }}"
  when: host_operation.action | default('') == 'inspect_keys'

- name: Read selected user authorized keys
  ansible.builtin.slurp:
    src: "{{ getent_passwd[host_operation.username][4] }}/.ssh/authorized_keys"
  register: inspected_authorized_keys
  failed_when: false
  when: host_operation.action | default('') == 'inspect_keys'

- name: Emit selected user authorized keys
  ansible.builtin.debug:
    msg:
      authorized_keys: "{{ inspected_authorized_keys.content | default('') | b64decode }}"
  when: host_operation.action | default('') == 'inspect_keys'

- name: Read effective SSH password authentication
  ansible.builtin.command:
    cmd: sshd -T
  register: sshd_effective
  changed_when: false
  check_mode: false
  when: host_operation.action | default('') == 'inspect_sshd'

- name: Emit effective SSH password authentication
  ansible.builtin.debug:
    msg:
      password_authentication: "{{ 'passwordauthentication yes' in sshd_effective.stdout or 'kbdinteractiveauthentication yes' in sshd_effective.stdout }}"
  when: host_operation.action | default('') == 'inspect_sshd'

- name: Validate proposed SSH password authentication setting
  ansible.builtin.command:
    cmd: "sshd -t -o PasswordAuthentication={{ 'yes' if host_operation.enabled else 'no' }} -o KbdInteractiveAuthentication={{ 'yes' if host_operation.enabled else 'no' }}"
  changed_when: false
  check_mode: false
  when: host_operation.action | default('') == 'sshd_password_authentication'

- name: Inspect managed SSH password authentication fragment
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/99-server-account-console.conf
  register: sshd_fragment_stat
  when: host_operation.action | default('') == 'sshd_password_authentication'

- name: Backup existing managed SSH password authentication fragment
  ansible.builtin.slurp:
    src: /etc/ssh/sshd_config.d/99-server-account-console.conf
  register: sshd_existing_fragment
  when:
    - host_operation.action | default('') == 'sshd_password_authentication'
    - sshd_fragment_stat.stat.exists

- name: Install and activate managed SSH password authentication fragment
  block:
    - name: Install managed SSH password authentication fragment
      ansible.builtin.copy:
        content: |
          PasswordAuthentication {{ 'yes' if host_operation.enabled else 'no' }}
          KbdInteractiveAuthentication {{ 'yes' if host_operation.enabled else 'no' }}
        dest: /etc/ssh/sshd_config.d/99-server-account-console.conf
        mode: "0644"

    - name: Validate active SSH configuration
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false

    - name: Reload SSH service
      ansible.builtin.service:
        name: sshd
        state: reloaded
      register: sshd_reload
      failed_when: false

    - name: Reload SSH service fallback
      ansible.builtin.service:
        name: ssh
        state: reloaded
      when: sshd_reload.failed | default(false)
  rescue:
    - name: Restore previous managed SSH password authentication fragment
      ansible.builtin.copy:
        content: "{{ sshd_existing_fragment.content | b64decode }}"
        dest: /etc/ssh/sshd_config.d/99-server-account-console.conf
        mode: "0644"
      when: sshd_fragment_stat.stat.exists

    - name: Remove newly created managed SSH password authentication fragment
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-server-account-console.conf
        state: absent
      when: not sshd_fragment_stat.stat.exists

    - name: Validate restored SSH configuration
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false

    - name: Reload restored SSH service
      ansible.builtin.service:
        name: sshd
        state: reloaded
      register: sshd_restore_reload
      failed_when: false

    - name: Reload restored SSH service fallback
      ansible.builtin.service:
        name: ssh
        state: reloaded
      when: sshd_restore_reload.failed | default(false)

    - name: Report SSH password authentication activation failure
      ansible.builtin.fail:
        msg: SSH 配置未能生效，已恢复原有配置
  when:
    - host_operation.action | default('') == 'sshd_password_authentication'
    - not ansible_check_mode

- name: Ensure primary group exists for user update
  ansible.builtin.group:
    name: "{{ host_operation.primary_group }}"
    state: present
  when:
    - host_operation.action == 'upsert'
    - host_operation.primary_group is defined

- name: Ensure supplemental groups exist for user update
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ host_operation.groups | default([]) }}"
  when: host_operation.action == 'upsert'

- name: Create or update local user
  ansible.builtin.user:
    name: "{{ host_operation.username }}"
    state: present
    group: "{{ host_operation.primary_group | default(omit) }}"
    groups: "{{ host_operation.groups | default(omit) }}"
    shell: "{{ host_operation.shell | default(omit) }}"
    home: "{{ host_operation.home | default(omit) }}"
    expires: "{{ host_operation.expires_at | default(omit) }}"
  when: host_operation.action == 'upsert'

- name: Lock or unlock local user
  ansible.builtin.user:
    name: "{{ host_operation.username }}"
    password_lock: "{{ host_operation.action == 'lock' }}"
  when: host_operation.action in ['lock', 'unlock']

- name: Set one-time local user password
  ansible.builtin.command:
    cmd: chpasswd
    stdin: "{{ host_operation_new_password }}"
  no_log: true
  when: host_operation.action == 'reset_password'

- name: Delete local user
  ansible.builtin.user:
    name: "{{ host_operation.username }}"
    state: absent
    remove: "{{ host_operation.remove_home | default(false) }}"
  when: host_operation.action == 'delete'

- name: Remove managed sudo policy when deleting local user
  ansible.builtin.file:
    path: "/etc/sudoers.d/server-account-{{ host_operation.username }}"
    state: absent
  when: host_operation.action == 'delete'

- name: Remove managed sudo policy when an update clears it
  ansible.builtin.file:
    path: "/etc/sudoers.d/server-account-{{ host_operation.username }}"
    state: absent
  when:
    - host_operation.action == 'upsert'
    - host_operation.sudo_rule is not defined or host_operation.sudo_rule | length == 0

- name: Load target user passwd entry for public key operation
  ansible.builtin.getent:
    database: passwd
    key: "{{ host_operation.username }}"
  when: host_operation.action == 'keys'

- name: Resolve existing user home for public key operation
  ansible.builtin.set_fact:
    host_operation_effective_home: "{{ host_operation.home | default(getent_passwd[host_operation.username][4], true) }}"
  when: host_operation.action == 'keys'

- name: Ensure SSH directory for public key operation
  ansible.builtin.file:
    path: "{{ host_operation_effective_home | default(host_operation.home | default('/home/' ~ host_operation.username)) }}/.ssh"
    state: directory
    owner: "{{ host_operation.username }}"
    group: "{{ host_operation.primary_group | default(host_operation.username, true) }}"
    mode: "0700"
  when:
    - host_operation.action in ['keys', 'upsert']
    - host_operation.public_keys | default([]) | length > 0

- name: Add public keys from managed person
  ansible.builtin.lineinfile:
    path: "{{ host_operation_effective_home | default(host_operation.home | default('/home/' ~ host_operation.username)) }}/.ssh/authorized_keys"
    line: "{{ item }}"
    create: true
    owner: "{{ host_operation.username }}"
    group: "{{ host_operation.primary_group | default(host_operation.username, true) }}"
    mode: "0600"
  loop: "{{ host_operation.public_keys | default([]) }}"
  when:
    - host_operation.action == 'upsert'
    - host_operation.public_keys | default([]) | length > 0

- name: Configure sudo policy for user update
  ansible.builtin.template:
    src: managed-sudoers.j2
    dest: "/etc/sudoers.d/server-account-{{ host_operation.username }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when:
    - host_operation.action == 'upsert'
    - host_operation.sudo_rule is defined
    - host_operation.sudo_rule | length > 0

- name: Append or remove authorized public keys
  ansible.builtin.lineinfile:
    path: "{{ host_operation_effective_home | default(host_operation.home | default('/home/' ~ host_operation.username)) }}/.ssh/authorized_keys"
    line: "{{ item }}"
    state: "{{ 'absent' if host_operation.key_mode == 'remove' else 'present' }}"
    create: true
    owner: "{{ host_operation.username }}"
    group: "{{ host_operation.primary_group | default(host_operation.username, true) }}"
    mode: "0600"
  loop: "{{ host_operation.public_keys | default([]) }}"
  when:
    - host_operation.action == 'keys'
    - host_operation.key_mode in ['append', 'remove']

- name: Replace authorized public keys
  ansible.builtin.copy:
    content: "{{ host_operation.public_keys | join('\n') }}\n"
    dest: "{{ host_operation_effective_home | default(host_operation.home | default('/home/' ~ host_operation.username)) }}/.ssh/authorized_keys"
    owner: "{{ host_operation.username }}"
    group: "{{ host_operation.primary_group | default(host_operation.username, true) }}"
    mode: "0600"
  when:
    - host_operation.action == 'keys'
    - host_operation.key_mode == 'replace'

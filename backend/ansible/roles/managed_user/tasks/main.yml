- name: Ensure primary group exists
  ansible.builtin.group:
    name: "{{ desired_user.primary_group | default(desired_user.username, true) }}"
    state: present

- name: Ensure supplemental groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ desired_user.groups | default([]) }}"

- name: Ensure Linux account exists
  ansible.builtin.user:
    name: "{{ desired_user.username }}"
    group: "{{ desired_user.primary_group | default(desired_user.username, true) }}"
    groups: "{{ desired_user.groups | default([]) | join(',') }}"
    append: true
    shell: "{{ desired_user.shell }}"
    home: "{{ desired_user.home }}"
    create_home: true
    state: present

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: "{{ desired_user.home }}/.ssh"
    state: directory
    owner: "{{ desired_user.username }}"
    group: "{{ desired_user.primary_group | default(desired_user.username, true) }}"
    mode: "0700"

- name: Add managed public keys without removing unmanaged keys
  ansible.builtin.lineinfile:
    path: "{{ desired_user.home }}/.ssh/authorized_keys"
    line: "{{ item }}"
    create: true
    owner: "{{ desired_user.username }}"
    group: "{{ desired_user.primary_group | default(desired_user.username, true) }}"
    mode: "0600"
  loop: "{{ desired_user.public_keys }}"

- name: Configure sudo policy
  ansible.builtin.template:
    src: managed-sudoers.j2
    dest: "/etc/sudoers.d/server-account-{{ desired_user.username }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: desired_user.sudo_rule | default('') | length > 0

- name: Record post script during preview
  ansible.builtin.debug:
    msg: "已选择后置脚本，正式执行时将在目标机器运行"
  when:
    - post_script_content | default('') | length > 0
    - ansible_check_mode

- name: Run approved post script
  when:
    - post_script_content | default('') | length > 0
    - not ansible_check_mode
  block:
    - name: Create remote post script workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: "server-account-console-"
      register: post_script_workspace

    - name: Transfer approved post script
      ansible.builtin.copy:
        content: "{{ post_script_content }}"
        dest: "{{ post_script_workspace.path }}/post-script.sh"
        mode: "0700"

    - name: Transfer frozen task input
      ansible.builtin.copy:
        content: "{{ task_input_json }}"
        dest: "{{ post_script_workspace.path }}/task-input.json"
        mode: "0600"

    - name: Execute approved post script
      ansible.builtin.command:
        cmd: "{{ post_script_workspace.path }}/post-script.sh"
      environment:
        SAC_INPUT_JSON: "{{ post_script_workspace.path }}/task-input.json"
  always:
    - name: Remove remote post script workspace
      ansible.builtin.file:
        path: "{{ post_script_workspace.path }}"
        state: absent
      when: post_script_workspace.path is defined

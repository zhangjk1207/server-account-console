services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CONTROL_SSH_KEY_PATH: ${CONTROL_SSH_KEY_PATH}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
    volumes:
      - ./runtime:/var/lib/server-account-console
      - ${SSH_KEY_PATH}:${CONTROL_SSH_KEY_PATH}:ro
    expose:
      - "8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"
